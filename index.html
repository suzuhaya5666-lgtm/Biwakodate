<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>琵琶湖 釣りデータ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fa;--card:#fff;--tx:#1b2733;--sub:#6b7a88;--ln:#dbe3ea;--ac:#1f6feb;--big:#fde2e0;--mid:#e3f0ff;--sml:#f0f0f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#18222c;--tx:#e6edf3;--sub:#8b9bab;--ln:#2a3846;--ac:#58a6ff;--big:#4a2226;--mid:#1c3350;--sml:#222c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
nav button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--sub);font-size:12px}
.d{min-height:64px;border-radius:8px;padding:4px;font-size:12px;background:var(--sml)}
.d b{font-size:13px}.d.大潮{background:var(--big)}.d.中潮{background:var(--mid)}.d.t{outline:2px solid var(--ac)}
.d span{display:block;color:var(--sub);font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);flex:1;min-width:110px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.n{text-align:right}
svg{width:100%;height:auto}
.note{color:var(--sub);font-size:12px}
</style>
</head>
<body>
<main>
<h1>🎣 琵琶湖 釣りデータ</h1>
<nav id="tabs"></nav>
<section id="v-now"></section>
<section id="v-cal" hidden></section>
<section id="v-chart" hidden></section>
<section id="v-rec" hidden></section>
<p class="note">出典: 国土交通省 川の防災情報(水位・水温)。潮名は月齢からの計算値です。</p>
</main>
<script>
const CSV_URLS=["https://raw.githubusercontent.com/suzuhaya5666-lgtm/Biwakodate/main/data/observations.csv","data/observations.csv"];
const SYN=29.530588853,$=s=>document.querySelector(s);
const MOONS=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
const LAB={level:"水位(m)",flow:"放流量(m³/s)",temp:"水温(℃)"};
const COL=["#1f6feb","#d1242f","#1a7f37","#9a6700","#8250df","#0a7ea4"];
const TABS=[["now","いま"],["cal","潮名カレンダー"],["chart","グラフ"],["rec","手入力"]];
const pad=n=>String(n).padStart(2,"0");
const num=v=>v===""||v==null||isNaN(Number(v))?null:Number(v);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function newMoon(k){const T=k/1236.85,R=Math.PI/180,E=1-0.002516*T-0.0000074*T*T,
 M=(2.5534+29.1053567*k)*R,P=(201.5643+385.81693528*k+0.0107582*T*T)*R,F=(160.7108+390.67050284*k-0.0016118*T*T)*R,O=(124.7746-1.56375588*k)*R;
 return 2451550.09766+29.530588861*k+0.00015437*T*T-0.4072*Math.sin(P)+0.17241*E*Math.sin(M)+0.01608*Math.sin(2*P)+0.01039*Math.sin(2*F)+0.00739*E*Math.sin(P-M)-0.00514*E*Math.sin(P+M)+0.00208*E*E*Math.sin(2*M)-0.00111*Math.sin(P-2*F)-0.00057*Math.sin(P+2*F)+0.00056*E*Math.sin(2*P+M)-0.00042*Math.sin(3*P)+0.00042*E*Math.sin(M+2*F)+0.00038*E*Math.sin(M-2*F)-0.00024*E*Math.sin(2*P-M)-0.00017*Math.sin(O)}
function age(y,m,d){const jd=Date.UTC(y,m,d,3)/864e5+2440587.5;let k=Math.floor((jd-2451550.09766)/29.530588861);while(newMoon(k+1)<=jd)k++;while(newMoon(k)>jd)k--;return jd-newMoon(k)}
function shio(a){const d=Math.min(30,Math.floor(a)+1),r=((d-1)%15)+1;if(r<=4)return"大潮";if(r<=7||r>=13)return"中潮";if(r<=10)return"小潮";return r===11?"長潮":"若潮"}
const moon=a=>MOONS[Math.floor(a/SYN*8+.5)%8];
function loadMan(){try{return JSON.parse(localStorage.getItem("bw_man")||"[]")}catch(e){return[]}}
function saveMan(){try{localStorage.setItem("bw_man",JSON.stringify(man))}catch(e){}}
let auto=[],man=loadMan(),cur=new Date(),tab="now",cm="temp",rng=7,err="読み込み中…";
const all=()=>auto.concat(man);
async function loadCsv(){
 for(const u of CSV_URLS){
  try{const r=await fetch(u+"?t="+Date.now());if(!r.ok)throw new Error(r.status);
   const ls=(await r.text()).trim().split(/\r?\n/),hd=ls.shift().split(",");
   auto=ls.map(l=>{const c=l.split(","),o={};hd.forEach((k,i)=>o[k]=c[i]);return{time:o.time,place:o.place,level:num(o.level),flow:num(o.flow),temp:num(o.temp)}});
   err="";return}catch(e){err="データを読み込めませんでした("+e.message+")"}}
}
function renderTabs(){$("#tabs").innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?"on":""}" data-k="${k}">${n}</button>`).join("");
 $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;show()})}
function show(){renderTabs();TABS.forEach(([k])=>$("#v-"+k).hidden=k!==tab);({now:now,cal:cal,chart:chart,rec:rec})[tab]()}
function now(){
 const t=new Date(),a=age(t.getFullYear(),t.getMonth(),t.getDate());
 let h=`<div class="card"><b>今日</b> ${moon(a)} ${shio(a)} / 月齢${a.toFixed(1)}</div>`;
 const rs=all();
 for(const m of["level","flow","temp"]){
  const last={};rs.filter(r=>r[m]!=null).forEach(r=>{if(!last[r.place]||r.time>last[r.place].time)last[r.place]=r});
  const ps=Object.keys(last);if(!ps.length)continue;
  h+=`<div class="card"><b>${LAB[m]}</b><table>`+ps.map(p=>`<tr><td>${esc(p)}</td><td class="n"><b>${last[p][m]}</b></td><td class="note">${last[p].time.replace("T"," ")}</td></tr>`).join("")+`</table></div>`}
 if(err)h+=`<p class="note">${esc(err)}</p>`;
 $("#v-now").innerHTML=h;
}
function cal(){
 const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),f=new Date(y,m,1).getDay(),t=new Date();
 let h=`<div class="card"><div class="row"><button id="pv">←</button><b style="flex:1;text-align:center">${y}年${m+1}月</b><button id="nx">→</button></div><div class="cal">`;
 h+="日月火水木金土".split("").map(c=>`<div class="h">${c}</div>`).join("")+"<div></div>".repeat(f);
 for(let d=1;d<=n;d++){const a=age(y,m,d),s=shio(a),td=t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d;
  h+=`<div class="d ${s} ${td?"t":""}"><b>${d}</b> ${moon(a)}<span>${s}</span><span>月齢${a.toFixed(1)}</span></div>`}
 $("#v-cal").innerHTML=h+`</div><p class="note">潮名は月齢から計算した目安です。公開されている潮名と1日ずれる場合があります。</p></div>`;
 $("#pv").onclick=()=>{cur=new Date(y,m-1,1);cal()};$("#nx").onclick=()=>{cur=new Date(y,m+1,1);cal()};
}
const fmt=ms=>{const d=new Date(ms);return`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:00`};
function chart(){
 const lim=rng?Date.now()-rng*864e5:0;
 const pts=all().filter(r=>r[cm]!=null&&new Date(r.time).getTime()>=lim);
 const places=[...new Set(pts.map(r=>r.place))];
 let svg='<p class="note">この期間のデータがありません。</p>',leg="";
 if(pts.length){
  const W=640,H=260,P=44,xs=pts.map(r=>new Date(r.time).getTime()),ys=pts.map(r=>r[cm]);
  const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=1;y1+=1}
  const X=v=>P+(x1===x0?.5:(v-x0)/(x1-x0))*(W-P-10),Y=v=>H-P-(v-y0)/(y1-y0)*(H-P-12);
  svg=`<svg viewBox="0 0 ${W} ${H}">`+
   [0,.5,1].map(f=>{const v=y0+(y1-y0)*f;return`<line x1="${P}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)"/><text x="${P-4}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--sub)">${+v.toFixed(2)}</text>`}).join("")+
   `<text x="${P}" y="${H-14}" font-size="11" fill="var(--sub)">${fmt(x0)}</text><text x="${W-10}" y="${H-14}" font-size="11" text-anchor="end" fill="var(--sub)">${fmt(x1)}</text>`+
   places.map((p,i)=>{const q=pts.filter(r=>r.place===p).sort((a,b)=>a.time.localeCompare(b.time));
    return`<polyline fill="none" stroke="${COL[i%COL.length]}" stroke-width="2" points="${q.map(r=>X(new Date(r.time).getTime())+","+Y(r[cm])).join(" ")}"/>`+(q.length<=3?q.map(r=>`<circle cx="${X(new Date(r.time).getTime())}" cy="${Y(r[cm])}" r="3" fill="${COL[i%COL.length]}"/>`).join(""):"")}).join("")+`</svg>`;
  leg=`<p class="note">`+places.map((p,i)=>`<span style="color:${COL[i%COL.length]}">━</span> ${esc(p)}`).join("　")+`</p>`}
 $("#v-chart").innerHTML=`<div class="card"><div class="row"><select id="cm">${Object.keys(LAB).map(k=>`<option value="${k}">${LAB[k]}</option>`).join("")}</select>
 <select id="rg"><option value="2">2日</option><option value="7">7日</option><option value="30">30日</option><option value="0">すべて</option></select></div>${svg}${leg}${err?`<p class="note">${esc(err)}</p>`:""}</div>`;
 $("#cm").value=cm;$("#rg").value=String(rng);
 $("#cm").onchange=e=>{cm=e.target.value;chart()};$("#rg").onchange=e=>{rng=+e.target.value;chart()};
}
function nowStr(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`}
function rec(){
 const rows=man.map((r,i)=>({r,i})).sort((a,b)=>b.r.time.localeCompare(a.r.time)).slice(0,30).map(({r,i})=>`<tr><td>${r.time.replace("T"," ")}</td><td>${esc(r.place)}</td><td class="n">${r.level??""}</td><td class="n">${r.flow??""}</td><td class="n">${r.temp??""}</td><td><button data-i="${i}">削除</button></td></tr>`).join("");
 $("#v-rec").innerHTML=`<div class="card"><p class="note">自動で取れない値(放流量など)を手で入れます。この端末のブラウザにだけ保存されます。</p>
 <div class="row"><label>日時<input id="t" type="datetime-local" value="${nowStr()}"></label><label>地点<input id="p" value="瀬田川洗堰"></label></div>
 <div class="row"><label>水位(m)<input id="l" type="number" step="any"></label><label>放流量(m³/s)<input id="f" type="number" step="any"></label><label>水温(℃)<input id="w" type="number" step="any"></label></div>
 <button class="pri" id="add">追加</button></div>
 <div class="card scroll"><table><tr><th>日時</th><th>地点</th><th>水位</th><th>放流量</th><th>水温</th><th></th></tr>${rows||'<tr><td colspan="6">まだ記録がありません</td></tr>'}</table></div>`;
 $("#add").onclick=()=>{const v=id=>num($(id).value),o={time:$("#t").value,place:$("#p").value||"未設定",level:v("#l"),flow:v("#f"),temp:v("#w")};
  if(!o.time||(o.level==null&&o.flow==null&&o.temp==null))return;man.push(o);saveMan();rec()};
 $("#v-rec").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{man.splice(+b.dataset.i,1);saveMan();rec()});
}
show();loadCsv().then(show);
</script>
</body>
</html>
