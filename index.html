<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>琵琶湖 釣りデータ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fa;--card:#fff;--tx:#1b2733;--sub:#6b7a88;--ln:#dbe3ea;--ac:#1f6feb;--big:#fde2e0;--mid:#e3f0ff;--sml:#f0f0f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#18222c;--tx:#e6edf3;--sub:#8b9bab;--ln:#2a3846;--ac:#58a6ff;--big:#4a2226;--mid:#1c3350;--sml:#222c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
nav button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--sub);font-size:12px}
.d{min-height:64px;border-radius:8px;padding:4px;font-size:12px;background:var(--sml)}
.d b{font-size:13px}.d.大潮{background:var(--big)}.d.中潮{background:var(--mid)}.d.t{outline:2px solid var(--ac)}
.d span{display:block;color:var(--sub);font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);flex:1;min-width:110px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.n{text-align:right}
svg{width:100%;height:auto}
.note{color:var(--sub);font-size:12px}
.bad{border-color:#d1242f}
.warn{color:#d1242f;font-weight:600}
.up{color:#d1242f}.dn{color:#1f6feb}
.chip{display:inline-block;margin:2px 14px 2px 0;white-space:nowrap}
.lbl{color:var(--sub);font-size:12px}
textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>🎣 琵琶湖 釣りデータ</h1>
<nav id="tabs"></nav>
<section id="v-now"></section>
<section id="v-cal" hidden></section>
<section id="v-chart" hidden></section>
<section id="v-rec" hidden></section>
<p class="note">出典: 国土交通省 川の防災情報・水文水質データベース(水位・水温)。潮名は月齢からの計算値です。</p>
</main>
<script>
const CSV_URLS=["https://raw.githubusercontent.com/suzuhaya5666-lgtm/Biwakodate/main/data/observations.csv","data/observations.csv"];
const REPO="https://raw.githubusercontent.com/suzuhaya5666-lgtm/Biwakodate/main/data/history/";
const HD_URLS=[REPO+"karahashi_daily.csv","data/history/karahashi_daily.csv"],HH_URLS=[REPO+"karahashi_hourly_history.csv","data/history/karahashi_hourly_history.csv"];
const HIST_END=new Date("2026-11-05T10:00").getTime();
const SYN=29.530588853,$=s=>document.querySelector(s);
const MOONS=["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
const LAB={temp:"水温(℃)",flow:"放流量(m³/s)",level:"水位(m)"};
const COL=["#1f6feb","#d1242f","#1a7f37","#9a6700","#8250df","#0a7ea4"];
const TABS=[["now","いま"],["chart","グラフ"],["cal","潮名カレンダー"],["rec","手入力"]];
const pad=n=>String(n).padStart(2,"0");
const num=v=>v===""||v==null||isNaN(Number(v))?null:Number(v);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function newMoon(k){const T=k/1236.85,R=Math.PI/180,E=1-0.002516*T-0.0000074*T*T,
 M=(2.5534+29.1053567*k)*R,P=(201.5643+385.81693528*k+0.0107582*T*T)*R,F=(160.7108+390.67050284*k-0.0016118*T*T)*R,O=(124.7746-1.56375588*k)*R;
 return 2451550.09766+29.530588861*k+0.00015437*T*T-0.4072*Math.sin(P)+0.17241*E*Math.sin(M)+0.01608*Math.sin(2*P)+0.01039*Math.sin(2*F)+0.00739*E*Math.sin(P-M)-0.00514*E*Math.sin(P+M)+0.00208*E*E*Math.sin(2*M)-0.00111*Math.sin(P-2*F)-0.00057*Math.sin(P+2*F)+0.00056*E*Math.sin(2*P+M)-0.00042*Math.sin(3*P)+0.00042*E*Math.sin(M+2*F)+0.00038*E*Math.sin(M-2*F)-0.00024*E*Math.sin(2*P-M)-0.00017*Math.sin(O)}
function age(y,m,d){const jd=Date.UTC(y,m,d,3)/864e5+2440587.5;let k=Math.floor((jd-2451550.09766)/29.530588861);while(newMoon(k+1)<=jd)k++;while(newMoon(k)>jd)k--;return jd-newMoon(k)}
function shio(a){const d=Math.min(30,Math.floor(a)+1),r=((d-1)%15)+1;if(r<=4)return"大潮";if(r<=7||r>=13)return"中潮";if(r<=10)return"小潮";return r===11?"長潮":"若潮"}
const moon=a=>MOONS[Math.floor(a/SYN*8+.5)%8];
function loadMan(){try{return JSON.parse(localStorage.getItem("bw_man")||"[]")}catch(e){return[]}}
function saveMan(){try{localStorage.setItem("bw_man",JSON.stringify(man))}catch(e){}}
function loadView(){const d={cm:"temp",rng:"7",cs:"",ce:"",yr:{}};try{return Object.assign(d,JSON.parse(localStorage.getItem("bw_view")||"{}"))}catch(e){return d}}
function saveView(){try{localStorage.setItem("bw_view",JSON.stringify(view))}catch(e){}}
let auto=[],hist=[],histHourly=false,histTried=false,histNote="",man=loadMan(),view=loadView(),cur=new Date(),tab="now",err="読み込み中…";
const all=()=>auto.concat(man.map(r=>({...r,src:"m"})));
async function loadCsv(){
 for(const u of CSV_URLS){
  try{const r=await fetch(u+"?t="+Date.now());if(!r.ok)throw new Error(r.status);
   const ls=(await r.text()).trim().split(/\r?\n/),hd=ls.shift().split(",");
   auto=ls.map(l=>{const c=l.split(","),o={};hd.forEach((k,i)=>o[k]=c[i]);return{time:o.time,place:o.place,level:num(o.level),flow:num(o.flow),temp:num(o.temp),src:"a"}});
   err="";return}catch(e){err="データを読み込めませんでした("+e.message+")"}}
}
async function fetchRows(urls,src){
 for(const u of urls){
  try{const r=await fetch(u+"?t="+Date.now());if(!r.ok)throw new Error(r.status);
   const ls=(await r.text()).trim().split(/\r?\n/),hd=ls.shift().split(",");
   return ls.map(l=>{const c=l.split(","),o={};hd.forEach((k,i)=>o[k]=c[i]);return{time:o.time,place:o.place,level:num(o.level),flow:num(o.flow),temp:num(o.temp),src}})}catch(e){}}
 return null}
async function loadHistDaily(){const r=await fetchRows(HD_URLS,"h");if(r&&!histHourly){hist=r;if(tab==="chart")chart()}}
async function loadHistHourly(){
 if(histHourly||histTried)return;histTried=true;histNote="1時間ごとの過去データを読み込み中…";if(tab==="chart")chart();
 const r=await fetchRows(HH_URLS,"h");
 if(r){hist=r;histHourly=true;histNote=""}else histNote="1時間ごとの過去データを読み込めませんでした(日平均で表示しています)";
 if(tab==="chart")chart()}
const tsOf=r=>r.ts??(r.ts=new Date(r.time).getTime());
function down(q,m,N=1500){if(q.length<=N)return q;const st=q.length/N,o=[];for(let i=0;i<N;i++){const a=Math.floor(i*st),b=Math.floor((i+1)*st),sl=q.slice(a,b);if(!sl.length)continue;o.push({time:sl[Math.floor(sl.length/2)].time,ts:tsOf(sl[Math.floor(sl.length/2)]),[m]:sl.reduce((t,r)=>t+r[m],0)/sl.length})}return o}
function renderTabs(){$("#tabs").innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?"on":""}" data-k="${k}">${n}</button>`).join("");
 $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;show()})}
function show(){renderTabs();TABS.forEach(([k])=>$("#v-"+k).hidden=k!==tab);({now:now,cal:cal,chart:chart,rec:rec})[tab]()}
const DP={level:2,flow:1,temp:1};
function nearest(rs,t,tol){let b=null,bd=1e18;for(const r of rs){const d=Math.abs(new Date(r.time).getTime()-t);if(d<bd){bd=d;b=r}}return b&&bd<=tol?b:null}
const dif=(a,b,m)=>a&&b?a[m]-b[m]:null;
function chg(v,m){if(v==null)return"–";const dp=DP[m];if(Math.abs(v)<0.5*Math.pow(10,-dp))return"±0";return`<span class="${v>0?"up":"dn"}">${v>0?"▲":"▼"}${Math.abs(v).toFixed(dp)}</span>`}
function now(){
 const t=new Date(),a=age(t.getFullYear(),t.getMonth(),t.getDate()),rs=all(),H=36e5,keys=Object.keys(LAB);
 const la=auto.reduce((m,r)=>r.time>m?r.time:m,"");
 const hr=la?(Date.now()-new Date(la).getTime())/H:0,bad=la&&hr>=3;
 const by=m=>{const o={};rs.filter(r=>r[m]!=null).forEach(r=>(o[r.place]=o[r.place]||[]).push(r));return o};
 const latest=q=>q.reduce((x,r)=>r.time>x.time?r:x);
 let h=`<div class="card${bad?" bad":""}"><div style="font-size:18px"><span class="note">今日</span> <b>${moon(a)} ${shio(a)}</b> <span class="note">月齢${a.toFixed(1)}</span></div>`;
 for(const m of keys){const g=by(m),ps=Object.keys(g);if(!ps.length)continue;
  h+=`<div style="margin-top:8px"><div class="lbl">${LAB[m]}</div>`+ps.map(p=>`<span class="chip">${esc(p)} <b>${latest(g[p])[m]}</b></span>`).join("")+`</div>`}
 if(la)h+=`<div class="note" style="margin-top:8px">データ最終更新 ${la.replace("T"," ")}(${hr<1?"1時間以内":Math.floor(hr)+"時間前"})</div>`;
 if(bad)h+=`<div class="warn">3時間以上更新がありません。取得が止まっている可能性があります。GitHub の Actions を確認してください。</div>`;
 h+=`</div>`;
 for(const m of keys){
  const g=by(m),ps=Object.keys(g);if(!ps.length)continue;
  h+=`<div class="card scroll"><b>${LAB[m]}</b><table><tr><th>地点</th><th class="n">現在</th><th class="n">前日比</th><th class="n">3時間</th><th>時刻</th></tr>`+ps.map(p=>{
   const q=g[p],L=latest(q),T=new Date(L.time).getTime();
   const d1=dif(L,nearest(q,T-24*H,2*H),m),d3=dif(L,nearest(q,T-3*H,1*H),m);
   const stale=L.src==="a"&&(Date.now()-T)/H>=3;
   return`<tr><td>${esc(p)}</td><td class="n"><b>${L[m]}</b></td><td class="n">${chg(d1,m)}</td><td class="n">${chg(d3,m)}</td><td class="note${stale?" warn":""}">${stale?"⚠ ":""}${L.time.slice(5).replace("T"," ")}</td></tr>`}).join("")+`</table></div>`}
 if(err)h+=`<p class="note">${esc(err)}</p>`;
 $("#v-now").innerHTML=h;
}
function cal(){
 const y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),f=new Date(y,m,1).getDay(),t=new Date();
 let h=`<div class="card"><div class="row"><button id="pv">←</button><b style="flex:1;text-align:center">${y}年${m+1}月</b><button id="nx">→</button></div><div class="cal">`;
 h+="日月火水木金土".split("").map(c=>`<div class="h">${c}</div>`).join("")+"<div></div>".repeat(f);
 for(let d=1;d<=n;d++){const a=age(y,m,d),s=shio(a),td=t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d;
  h+=`<div class="d ${s} ${td?"t":""}"><b>${d}</b> ${moon(a)}<span>${s}</span><span>月齢${a.toFixed(1)}</span></div>`}
 $("#v-cal").innerHTML=h+`</div><p class="note">潮名は月齢から計算した目安です。公開されている潮名と1日ずれる場合があります。</p></div>`;
 $("#pv").onclick=()=>{cur=new Date(y,m-1,1);cal()};$("#nx").onclick=()=>{cur=new Date(y,m+1,1);cal()};
}
const fmt=ms=>{const d=new Date(ms);return`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:00`};
function chart(){
 const cm=view.cm,yr=view.yr[cm]||["",""],custom=view.rng==="c";
 let lo=0,hi=Infinity;
 if(custom){if(view.cs)lo=new Date(view.cs+"T00:00").getTime();if(view.ce)hi=new Date(view.ce+"T23:59").getTime()}
 else if(+view.rng)lo=Date.now()-(+view.rng)*864e5;
 const pts=all().concat(hist).filter(r=>{const t=tsOf(r);return r[cm]!=null&&t>=lo&&t<=hi});
 const need=custom&&!histHourly&&!histTried&&view.cs&&lo>0&&lo<HIST_END&&((hi===Infinity?Date.now():hi)-lo)<=62*864e5;
 const places=[...new Set(pts.map(r=>r.place))];
 let svg='<p class="note">この期間のデータがありません。</p>',leg="";
 if(pts.length){
  const W=640,H=260,P=44,xs=pts.map(r=>tsOf(r)),ys=pts.map(r=>r[cm]);
  const mn=a=>a.reduce((m,v)=>v<m?v:m,Infinity),mx=a=>a.reduce((m,v)=>v>m?v:m,-Infinity);
  const x0=custom&&view.cs?lo:mn(xs),x1=custom&&view.ce?hi:mx(xs);
  let y0=mn(ys),y1=mx(ys);
  if(yr[0]!==""&&!isNaN(+yr[0]))y0=+yr[0];
  if(yr[1]!==""&&!isNaN(+yr[1]))y1=+yr[1];
  if(y0===y1&&yr[0]===""&&yr[1]===""){y0-=1;y1+=1}else if(y0>=y1)y1=y0+1;
  const X=v=>P+(x1===x0?.5:(v-x0)/(x1-x0))*(W-P-10),Y=v=>H-P-(v-y0)/(y1-y0)*(H-P-12);
  svg=`<svg viewBox="0 0 ${W} ${H}"><defs><clipPath id="cp"><rect x="${P}" y="8" width="${W-P-10}" height="${H-P-8}"/></clipPath></defs>`+
   [0,.5,1].map(f=>{const v=y0+(y1-y0)*f;return`<line x1="${P}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)"/><text x="${P-4}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="var(--sub)">${+v.toFixed(2)}</text>`}).join("")+
   `<text x="${P}" y="${H-14}" font-size="11" fill="var(--sub)">${fmt(x0)}</text><text x="${W-10}" y="${H-14}" font-size="11" text-anchor="end" fill="var(--sub)">${fmt(x1)}</text><g clip-path="url(#cp)">`+
   places.map((p,i)=>{const q0=pts.filter(r=>r.place===p).sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0),q=down(q0,cm);
    return`<polyline fill="none" stroke="${COL[i%COL.length]}" stroke-width="2" points="${q.map(r=>X(tsOf(r))+","+Y(r[cm])).join(" ")}"/>`+(q.length<=3?q.map(r=>`<circle cx="${X(tsOf(r))}" cy="${Y(r[cm])}" r="3" fill="${COL[i%COL.length]}"/>`).join(""):"")}).join("")+`</g></svg>`;
  leg=`<p class="note">`+places.map((p,i)=>`<span style="color:${COL[i%COL.length]}">━</span> ${esc(p)}`).join("　")+`</p>`}
 $("#v-chart").innerHTML=`<div class="card"><div class="row"><select id="cm">${Object.keys(LAB).map(k=>`<option value="${k}">${LAB[k]}</option>`).join("")}</select>
 <select id="rg"><option value="2">2日</option><option value="7">7日</option><option value="30">30日</option><option value="0">すべて</option><option value="c">期間を指定</option></select></div>
 ${custom?`<div class="row"><label>開始日<input id="cs" type="date" value="${view.cs}"></label><label>終了日<input id="ce" type="date" value="${view.ce}"></label></div>`:""}
 <div class="row"><label>縦軸の最小<input id="y0" type="number" step="any" placeholder="自動" value="${yr[0]}"></label><label>縦軸の最大<input id="y1" type="number" step="any" placeholder="自動" value="${yr[1]}"></label><button id="ya">自動に戻す</button></div>
 ${svg}${leg}${histNote?`<p class="note">${esc(histNote)}</p>`:""}${err?`<p class="note">${esc(err)}</p>`:""}</div>`;
 $("#cm").value=cm;$("#rg").value=view.rng;
 const set=(k,v)=>{view[k]=v;saveView();chart()},setY=(i,v)=>{const a=view.yr[cm]||["",""];a[i]=v;view.yr[cm]=a;saveView();chart()};
 $("#cm").onchange=e=>set("cm",e.target.value);$("#rg").onchange=e=>set("rng",e.target.value);
 if(custom){$("#cs").onchange=e=>set("cs",e.target.value);$("#ce").onchange=e=>set("ce",e.target.value)}
 $("#y0").onchange=e=>setY(0,e.target.value);$("#y1").onchange=e=>setY(1,e.target.value);
 $("#ya").onclick=()=>{delete view.yr[cm];saveView();chart()};
 if(need)setTimeout(loadHistHourly,0);
}
function nowStr(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`}
function rec(){
 const rows=man.map((r,i)=>({r,i})).sort((a,b)=>b.r.time.localeCompare(a.r.time)).slice(0,30).map(({r,i})=>`<tr><td>${r.time.replace("T"," ")}</td><td>${esc(r.place)}</td><td class="n">${r.level??""}</td><td class="n">${r.flow??""}</td><td class="n">${r.temp??""}</td><td><button data-i="${i}">削除</button></td></tr>`).join("");
 $("#v-rec").innerHTML=`<div class="card"><p class="note">自動で取れない値(放流量など)を手で入れます。この端末のブラウザにだけ保存されます。</p>
 <div class="row"><label>日時<input id="t" type="datetime-local" value="${nowStr()}"></label><label>地点<input id="p" value="瀬田川洗堰"></label></div>
 <div class="row"><label>水位(m)<input id="l" type="number" step="any"></label><label>放流量(m³/s)<input id="f" type="number" step="any"></label><label>水温(℃)<input id="w" type="number" step="any"></label></div>
 <button class="pri" id="add">追加</button></div>
 <div class="card scroll"><table><tr><th>日時</th><th>地点</th><th>水位</th><th>放流量</th><th>水温</th><th></th></tr>${rows||'<tr><td colspan="6">まだ記録がありません</td></tr>'}</table></div>
 <div class="card"><b>バックアップ</b><p class="note">手入力の記録を、文字として書き出し・読み込みできます。書き出した文字は、メモアプリなどに保存してください。</p>
 <div class="row"><button id="bx">書き出す</button><button id="bi">読み込む</button></div>
 <textarea id="bt" rows="6"></textarea>
 <div class="row"><button id="bc" hidden>コピー</button><button id="bo" class="pri" hidden>取り込む</button></div></div>`;
 $("#add").onclick=()=>{const v=id=>num($(id).value),o={time:$("#t").value,place:$("#p").value||"未設定",level:v("#l"),flow:v("#f"),temp:v("#w")};
  if(!o.time||(o.level==null&&o.flow==null&&o.temp==null))return;man.push(o);saveMan();rec()};
 $("#v-rec").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{man.splice(+b.dataset.i,1);saveMan();rec()});
 const bt=$("#bt");
 $("#bx").onclick=()=>{bt.value="time,place,level,flow,temp\n"+man.map(r=>[r.time,r.place,r.level??"",r.flow??"",r.temp??""].join(",")).join("\n");$("#bc").hidden=false;$("#bo").hidden=true;bt.select()};
 $("#bi").onclick=()=>{bt.value="";bt.placeholder="ここに書き出した文字を貼って、「取り込む」を押してください";$("#bo").hidden=false;$("#bc").hidden=true;bt.focus()};
 $("#bc").onclick=async()=>{try{await navigator.clipboard.writeText(bt.value);alert("コピーしました")}catch(e){bt.select();alert("文字を選択しました。コピーしてください")}};
 $("#bo").onclick=()=>{let add=0;const have=new Set(man.map(x=>[x.time,x.place,x.level,x.flow,x.temp].join("|")));
  bt.value.split(/\r?\n/).forEach(l=>{const c=l.split(",");if(c.length<5||c[0]==="time")return;
   const o={time:c[0].trim().replace(" ","T").slice(0,16),place:c[1].trim()||"未設定",level:num(c[2]),flow:num(c[3]),temp:num(c[4])};
   if(!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(o.time)||(o.level==null&&o.flow==null&&o.temp==null))return;
   const k=[o.time,o.place,o.level,o.flow,o.temp].join("|");if(have.has(k))return;have.add(k);man.push(o);add++});
  saveMan();alert(add+" 件を取り込みました");rec()};
}
show();loadCsv().then(show);loadHistDaily();
