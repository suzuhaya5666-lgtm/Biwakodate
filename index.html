<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>琵琶湖 釣りデータ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fa;--card:#fff;--tx:#1b2733;--sub:#6b7a88;--ln:#dbe3ea;--ac:#1f6feb;--big:#fde2e0;--hl:#fff1b8;--mid:#e3f0ff;--sml:#f0f0f0}
@media (prefers-color-scheme:dark){:root{--bg:#0f161d;--card:#18222c;--tx:#e6edf3;--sub:#8b9bab;--ln:#2a3846;--ac:#58a6ff;--big:#4a2226;--hl:#4b3f10;--mid:#1c3350;--sml:#222c36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
nav button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--sub);font-size:12px}
.d{min-height:64px;border-radius:8px;padding:4px;font-size:12px;background:var(--sml)}
.d b{font-size:13px}.d.大潮{background:var(--big)}.d.中潮{background:var(--mid)}.d.t{outline:2px solid var(--ac)}
.d span{display:block;color:var(--sub);font-size:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.row label{display:flex;flex-direction:column;font-size:12px;color:var(--sub);flex:1;min-width:110px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
.n{text-align:right}
svg{width:100%;height:auto;touch-action:pan-y}
.pl{padding:4px 10px;border-radius:16px;font-size:13px}
#wxm svg{max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px);touch-action:manipulation}
#wxm g.pin{cursor:pointer}
.sheet{position:fixed;left:0;right:0;bottom:0;height:50vh;display:flex;flex-direction:column;background:var(--card);border-top:1px solid var(--ln);border-radius:16px 16px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.18);z-index:5}
.sheet table{font-size:13px}
.tb{flex:1;overflow:auto;min-height:0}
.tb th{position:sticky;top:0;background:var(--card)}
#wxm.op{padding-bottom:50vh}
.sheet tr.cn td{background:var(--mid)}
.trow{border-top:1px solid var(--ln);padding:10px 0;cursor:pointer}
tr.hl td{background:var(--hl);font-weight:600}
.bar{display:inline-block;height:8px;background:var(--ac);border-radius:4px;vertical-align:middle;margin-left:4px}
.note{color:var(--sub);font-size:12px}
.bad{border-color:#d1242f}
.warn{color:#d1242f;font-weight:600}
.up{color:#d1242f}.dn{color:#1f6feb}
.chip{display:inline-block;margin:2px 14px 2px 0;white-space:nowrap}
.lbl{color:var(--sub);font-size:12px}
textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px;margin:8px 0}
</style>
</head>

  <div class="row"><label>その他の場所(自由入力。「、」で区切る)<input id="fo" value="${esc(t.other)}"></label></div>
  <div class="row"><label>釣果(任意)<input id="fc" value="${esc(t.catch)}"></label></div>
  <label class="lbl">メモ(任意)<textarea id="fm" rows="3">${esc(t.memo)}</textarea></label>
  <div class="row"><button class="pri" id="fs">保存</button><button id="fx">キャンセル</button></div></div>`;
  el.querySelectorAll("button[data-s]").forEach(b=>b.onclick=()=>{const s=b.dataset.s,i=tf.spots.indexOf(s);if(i<0)tf.spots.push(s);else tf.spots.splice(i,1);const on=tf.spots.includes(s);b.style.background=on?"var(--ac)":"";b.style.color=on?"#fff":""});
  $("#fx").onclick=()=>{tripEdit=null;trip()};
  $("#fs").onclick=()=>{const date=$("#fd").value;if(!date)return;const oth=$("#fo").value.split(/[、,]/).map(x=>x.trim()).filter(Boolean),sp=[...new Set(tf.spots.concat(oth))];
   const o={id:tf.id||Date.now().toString(36),date,spots:sp,catch:$("#fc").value.trim(),memo:$("#fm").value.trim()};
   const i=trips.findIndex(x=>x.id===o.id);if(i<0)trips.push(o);else trips[i]=o;saveTrips();tripEdit=null;tripSel=o.id;tv=null;trip()};
  return}
 if(tripSel){const t=trips.find(x=>x.id===tripSel);if(!t){tripSel=null;return trip()}
  if(!wxD&&!wxBusy)loadWx();[t.date,dstr(t.date,-5),dstr(t.date,2)].forEach(d=>loadWxHr(+d.slice(0,4)));
  const pls=tripPlaces(t);if(!pls.includes(tripPl))tripPl=pls[0];
  const rs=all(),td=nowStr().slice(0,10);let rows="";
  for(let n=-5;n<=2;n++){const d=dstr(t.date,n),g=dayAgg(tripPl,d),lv=dayAvg(rs,"level",d,"琵琶湖(平均)")??dayAvg(rs,"level",d,"雄琴沖"),fl=dayAvg(rs,"flow",d);
   rows+=`<tr class="${n===0?"hl":""}"><td>${md(d)}${n===0?" 釣行":""}</td><td>${tideOf(d)}</td><td>${g.code==null?"–":WXE(g.code)+" "+WXN(g.code)}</td><td class="n">${g.precip==null?"–":f1(g.precip)+"mm"}</td><td>${g.dir==null?"–":arrow(g.dir)+" "+dirN(g.dir)}</td><td class="n">${f1(g.wmax)}</td><td class="n">${g.tmin==null?"–":Math.round(g.tmin)+"〜"+Math.round(g.tmax)+"℃"}</td><td class="n">${lv==null?"–":lv.toFixed(2)}</td><td class="n">${fl==null?"–":fl.toFixed(0)}</td></tr>`}
  el.innerHTML=`<div class="card"><div class="row"><button id="tb">← 一覧</button><span style="flex:1"></span><button id="te">編集</button><button id="td">削除</button></div>
  <div style="font-size:18px"><b>${md(t.date)}</b> ${t.date.slice(0,4)}年　${tideOf(t.date)}</div>
  <div style="margin-top:4px">📍 ${(t.spots||[]).map(esc).join("、")||"場所の指定なし"}</div>
  ${t.catch?`<div style="margin-top:4px">🎣 ${esc(t.catch)}</div>`:""}${t.memo?`<div class="note" style="margin-top:4px;white-space:pre-wrap">${esc(t.memo)}</div>`:""}</div>
  <div class="card scroll"><b>天気(5日前〜2日後)</b><div class="row" style="margin:6px 0">${pls.map(p=>`<button class="pl ${p===tripPl?"pri":""}" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div>
  <table><tr><th>日付</th><th>潮</th><th>天気</th><th class="n">雨量</th><th>風向</th><th class="n">最大風速</th><th class="n">気温</th><th class="n">水位</th><th class="n">放流量</th></tr>${rows}</table>
  <p class="note">雨量は1日の合計(mm)、風速はm/s、水位は琵琶湖の1日の平均(m)、放流量は手入力の値(m³/s)です。データがない日は「–」です。${wxD||Object.keys(wxHr).length?"":" 天気を読み込み中…"}</p></div>
  <div id="tchart"></div>`;
  $("#tb").onclick=()=>{tripSel=null;tv=null;trip()};
  $("#te").onclick=()=>{tf={id:t.id,date:t.date,spots:(t.spots||[]).filter(x=>WXP.some(p=>p[0]===x)),other:(t.spots||[]).filter(x=>!WXP.some(p=>p[0]===x)).join("、"),catch:t.catch||"",memo:t.memo||""};tripEdit=t.id;trip()};
  $("#td").onclick=()=>{if(confirm("この釣行記録を削除しますか?")){trips=trips.filter(x=>x.id!==t.id);saveTrips();tripSel=null;tv=null;trip()}};
  el.querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>{tripPl=b.dataset.p;trip()});
  if(!tv||tv.tid!==t.id)tv={tid:t.id,cm:"temp",rng:"c",cs:dstr(t.date,-5),ce:dstr(t.date,2),yr:{},base:view.base,hide:[]};
  const root=$("#tchart"),op={P:"t",fixed:true,band:[new Date(t.date+"T00:00").getTime(),new Date(t.date+"T23:59").getTime()],save:()=>{},rerender:()=>chartRender(root,tv,op)};
  chartRender(root,tv,op);return}
 const L=trips.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
 if(L.length&&!wxD&&!wxBusy)loadWx();if(L.length)[...new Set(L.map(t=>+t.date.slice(0,4)))].forEach(loadWxHr);
 el.innerHTML=`<div class="card"><div class="row"><b style="flex:1;font-size:17px">釣行の記録</b><button class="pri" id="tn">＋ 追加</button></div>
  <p class="note">記録はこの端末のブラウザにだけ保存されます。バックアップは下から書き出せます。</p>
  ${L.length?L.map(t=>{const pl=tripPlaces(t)[0],g=dayAgg(pl,t.date);
   return`<div class="trow" data-id="${t.id}"><b>${md(t.date)}</b> ${t.date.slice(0,4)}　${tideOf(t.date)}<br>📍 ${(t.spots||[]).map(esc).join("、")||"場所の指定なし"}
   <div class="note">${g.code==null?"天気データなし":`${WXE(g.code)} ${WXN(g.code)}・雨${f1(g.precip)}mm・${g.dir==null?"":dirN(g.dir)+" "}最大${f1(g.wmax)}m/s`}${t.catch?"　🎣 "+esc(t.catch):""}</div></div>`}).join(""):'<p class="note">まだ記録がありません。「＋ 追加」から登録できます。</p>'}</div>
  <div class="card"><b>バックアップ</b><p class="note">釣行の記録を文字として書き出し・読み込みできます。書き出した文字は、メモアプリなどに保存してください。</p>
  <div class="row"><button id="xb">書き出す</button><button id="ib">読み込む</button></div><textarea id="xt" rows="5"></textarea><div class="row"><button id="xo" class="pri" hidden>取り込む</button></div></div>`;
 $("#tn").onclick=()=>{tf={id:"",date:nowStr().slice(0,10),spots:[],other:"",catch:"",memo:""};tripEdit="new";trip()};
 el.querySelectorAll(".trow").forEach(e=>e.onclick=()=>{tripSel=e.dataset.id;tv=null;trip();scrollTo(0,0)});
 const xt=$("#xt");
 $("#xb").onclick=()=>{xt.value=JSON.stringify(trips);$("#xo").hidden=true;xt.select()};
 $("#ib").onclick=()=>{xt.value="";xt.placeholder="ここに書き出した文字を貼って、「取り込む」を押してください";$("#xo").hidden=false;xt.focus()};
 $("#xo").onclick=()=>{try{const a=JSON.parse(xt.value);if(!Array.isArray(a))throw 0;let n=0;const have=new Set(trips.map(t=>t.id));
  a.forEach(t=>{if(t&&t.id&&/^\d{4}-\d\d-\d\d$/.test(t.date)&&!have.has(t.id)){trips.push({id:String(t.id),date:t.date,spots:Array.isArray(t.spots)?t.spots.map(String):[],catch:String(t.catch||""),memo:String(t.memo||"")});have.add(t.id);n++}});
  saveTrips();alert(n+" 件を取り込みました");trip()}catch(e){alert("読み込めませんでした。書き出した文字をそのまま貼ってください")}};
}
function nowStr(){const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`}
function rec(){
 const rows=man.map((r,i)=>({r,i})).sort((a,b)=>b.r.time.localeCompare(a.r.time)).slice(0,30).map(({r,i})=>`<tr><td>${r.time.replace("T"," ")}</td><td>${esc(r.place)}</td><td class="n">${r.level??""}</td><td class="n">${r.flow??""}</td><td class="n">${r.temp??""}</td><td>${r.flow!=null?(r.end||"次の入力まで"):""}</td><td><button data-i="${i}">削除</button></td></tr>`).join("");
 $("#v-rec").innerHTML=`<div class="card"><p class="note">自動で取れない値(放流量など)を手で入れます。この端末のブラウザにだけ保存されます。<br>放流量は、終了日を入れるとその日まで、空欄なら次に入力するまで、同じ値が続くものとして扱います。</p>
 <div class="row"><label>日時<input id="t" type="datetime-local" value="${nowStr()}"></label><label>地点<input id="p" value="瀬田川洗堰"></label></div>
 <div class="row"><label>水位(m)<input id="l" type="number" step="any"></label><label>放流量(m³/s)<input id="f" type="number" step="any"></label><label>水温(℃)<input id="w" type="number" step="any"></label><label>放流量の終了日(任意)<input id="e" type="date"></label></div>
 <button class="pri" id="add">追加</button></div>
 <div class="card scroll"><table><tr><th>日時</th><th>地点</th><th>水位</th><th>放流量</th><th>水温</th><th>放流量の期間</th><th></th></tr>${rows||'<tr><td colspan="7">まだ記録がありません</td></tr>'}</table></div>
 <div class="card"><b>バックアップ</b><p class="note">手入力の記録を、文字として書き出し・読み込みできます。書き出した文字は、メモアプリなどに保存してください。</p>
 <div class="row"><button id="bx">書き出す</button><button id="bi">読み込む</button></div>
 <textarea id="bt" rows="6"></textarea>
 <div class="row"><button id="bc" hidden>コピー</button><button id="bo" class="pri" hidden>取り込む</button></div></div>`;
 $("#add").onclick=()=>{const v=id=>num($(id).value),o={time:$("#t").value,place:$("#p").value||"未設定",level:v("#l"),flow:v("#f"),temp:v("#w"),end:$("#e").value||""};
  if(!o.time||(o.level==null&&o.flow==null&&o.temp==null))return;if(o.flow==null)o.end="";man.push(o);saveMan();rec()};
 $("#v-rec").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{man.splice(+b.dataset.i,1);saveMan();rec()});
 const bt=$("#bt");
 $("#bx").onclick=()=>{bt.value="time,place,level,flow,temp,end\n"+man.map(r=>[r.time,r.place,r.level??"",r.flow??"",r.temp??"",r.end||""].join(",")).join("\n");$("#bc").hidden=false;$("#bo").hidden=true;bt.select()};
 $("#bi").onclick=()=>{bt.value="";bt.placeholder="ここに書き出した文字を貼って、「取り込む」を押してください";$("#bo").hidden=false;$("#bc").hidden=true;bt.focus()};
 $("#bc").onclick=async()=>{try{await navigator.clipboard.writeText(bt.value);alert("コピーしました")}catch(e){bt.select();alert("文字を選択しました。コピーしてください")}};
 $("#bo").onclick=()=>{let add=0;const have=new Set(man.map(x=>[x.time,x.place,x.level,x.flow,x.temp,x.end||""].join("|")));
  bt.value.split(/\r?\n/).forEach(l=>{const c=l.split(",");if(c.length<5||c[0]==="time")return;
   const o={time:c[0].trim().replace(" ","T").slice(0,16),place:c[1].trim()||"未設定",level:num(c[2]),flow:num(c[3]),temp:num(c[4]),end:/^\d{4}-\d\d-\d\d$/.test((c[5]||"").trim())?c[5].trim():""};
   if(!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(o.time)||(o.level==null&&o.flow==null&&o.temp==null))return;
   const k=[o.time,o.place,o.level,o.flow,o.temp,o.end].join("|");if(have.has(k))return;have.add(k);man.push(o);add++});
  saveMan();alert(add+" 件を取り込みました");rec()};
}
show();loadCsv().then(show);loadHistDaily();
</script>
